<title>시빅 정비수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 정비수첩. 상단에 주행거리계, 아래로 탭 5개(요약·교체 주기·정비 이력·통계·시트). 표면은 한 겹, 카드는 입력과 차트에만. */
:root{
  --bg:#eceff2; --surface:#fafbfc; --sunk:#e1e6ea; --ink:#0f1418; --ink2:#47525a; --muted:#6f7c85;
  --line:#d3d9dd; --accent:#256abf; --accent-ink:#ffffff; --accent-soft:#dbe8f7;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --crit-text:#b32d2d;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e1e5e8; --axis:#c3cbd0;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1215; --surface:#161b1f; --sunk:#0b0f11; --ink:#eef1f3; --ink2:#b4bdc3; --muted:#8b969d;
    --line:#272e33; --accent:#5598e7; --accent-ink:#0b1218; --accent-soft:#16273a;
    --crit-text:#ee7a7a; --s1:#3987e5; --s2:#d95926; --grid:#252b2f; --axis:#384046; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1215; --surface:#161b1f; --sunk:#0b0f11; --ink:#eef1f3; --ink2:#b4bdc3; --muted:#8b969d;
  --line:#272e33; --accent:#5598e7; --accent-ink:#0b1218; --accent-soft:#16273a;
  --crit-text:#ee7a7a; --s1:#3987e5; --s2:#d95926; --grid:#252b2f; --axis:#384046; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-block:28px 18px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:6px;color:var(--ink2);font-size:13px}
.plate{border:1px solid var(--ink);border-radius:3px;padding:0 7px;font-weight:600;color:var(--ink);letter-spacing:.04em}
.odo-box{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.odo-label{font-size:12px;color:var(--muted)}
.odo{display:flex;align-items:center;gap:3px}
.odo .d{width:22px;height:34px;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:3px;font:600 19px var(--mono)}
.odo .d.z{color:var(--muted)}
.odo .sep{width:5px}
.odo .u{font:12px var(--mono);color:var(--muted);margin-left:6px}
.km-edit{display:flex;gap:6px;align-items:center}
.km-edit input{width:132px;text-align:right;font-family:var(--mono)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:22px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px}
.stack{display:grid;gap:28px;min-width:0}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
h2.sec{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row .main{min-width:0;flex:1}
.row .ttl{font-weight:500;overflow-wrap:anywhere}
.row .meta{color:var(--ink2);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.row .end{text-align:right;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel + .panel{margin-top:16px}
.panel h3{margin:0 0 4px;font-size:15px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.big{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.btn{appearance:none;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:4px 8px}
.btn.danger{color:var(--crit-text)}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:1px 9px;border:1px solid var(--line);border-radius:99px;white-space:nowrap;background:var(--surface)}
.pill i{font-style:normal;font-size:9px}
.pill.ok i{color:var(--good)} .pill.soon i{color:var(--warn)} .pill.over i{color:var(--crit)} .pill.none i{color:var(--muted)}
.pill.honda i{color:var(--s1)} .pill.general i{color:var(--s2)}
.pill.ins i{color:var(--muted)}
.part{padding:13px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.part:last-child{border-bottom:1px solid var(--line)}
.part-h{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent);border-radius:3px}
.soon .meter b{background:var(--warn)} .over .meter b{background:var(--crit)}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink2);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{appearance:none;padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.search{width:100%;max-width:320px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.bar-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
details.rec{border-top:1px solid var(--line)}
details.rec:last-of-type{border-bottom:1px solid var(--line)}
details.rec summary{list-style:none;cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:11px 0}
details.rec summary::-webkit-details-marker{display:none}
.rec-body{padding:0 0 14px;display:grid;gap:8px}
.rec-body ul{margin:0;padding-left:18px;color:var(--ink2)}
.date{font:500 12.5px var(--mono);color:var(--ink2)}
.est .ttl{color:var(--ink2)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.formgrid .wide{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12px;color:var(--ink2);min-width:0}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
label.f textarea{min-height:92px;resize:vertical}
.charts{display:grid;gap:28px}
.cbox{position:relative}
.cbox svg{display:block;width:100%;height:auto}
.tick{fill:var(--muted);font:11px var(--mono)}
.axl{fill:var(--ink2);font:11.5px var(--font)}
.vlab{fill:var(--ink2);font:600 11px var(--mono)}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.bar{fill:var(--s1)}
.ln{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round}
.pt{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.hl{fill:none;stroke:var(--ink);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;line-height:1.45;white-space:nowrap;z-index:5;transform:translate(-50%,calc(-100% - 10px))}
.legend{display:flex;gap:16px;margin:2px 0 10px;color:var(--ink2);font-size:12.5px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(84px,130px) minmax(0,1fr) auto;gap:10px;align-items:center}
.hb .nm{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.hb .tr{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hb .tr b{display:block;height:100%;border-radius:0 4px 4px 0}
.hb .vl{font:600 12px var(--mono);color:var(--ink2);min-width:86px;text-align:right}
.toggle{display:inline-flex;gap:8px;align-items:center;color:var(--ink2);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
.empty{padding:28px 0;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.notice{border-left:3px solid var(--muted);padding:6px 12px;color:var(--ink2);font-size:13px;margin:0 0 16px}
.out{margin-top:12px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.out a{color:var(--accent)}
.files{display:grid;gap:0;margin-top:10px}
.files button{appearance:none;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.files button:last-child{border-bottom:1px solid var(--line)}
.files button:hover{background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){.meter b{transition:width .3s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>시빅 정비수첩</h1>
      <div class="sub"><span class="plate">31버7847</span><span>CIVIC 1.8 · FD1 · 2008년식</span><span>최초등록 2007-12-21</span></div>
    </div>
    <div class="odo-box" id="head"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="보기" id="tabs"></nav>
  <main id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/*PURE-START*/
const DAY=86400000;
function pd(s){const a=String(s).split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]));}
function ymd(d){return d.toISOString().slice(0,10);}
function addMonths(s,n){const d=pd(s);const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d.getUTCDate(),last));return t;}
function daysBetween(a,b){return Math.round((b-a)/DAY);}
function calcPart(p,km,today){
  const out={kmLeft:null,daysLeft:null,ratio:0,status:'none',due:null};
  const r=[];
  if(p.intervalKm>0&&p.lastKm!=null&&p.lastKm!==''){out.kmLeft=p.lastKm+p.intervalKm-km;r.push((km-p.lastKm)/p.intervalKm);}
  if(p.intervalMonths>0&&p.lastDate){const due=addMonths(p.lastDate,p.intervalMonths);out.due=ymd(due);out.daysLeft=daysBetween(today,due);const tot=daysBetween(pd(p.lastDate),due);r.push(tot>0?(tot-out.daysLeft)/tot:0);}
  out.ratio=r.length?Math.max.apply(null,r):0;
  out.status=!r.length?'none':out.ratio>=1?'over':out.ratio>=0.85?'soon':'ok';
  return out;
}
function csvEsc(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
const REC_COLS=['id','date','km','shop','shopType','kind','title','items','amount','note'];
const COL_KO={id:'id',date:'날짜',km:'주행거리',shop:'정비소',shopType:'정비소유형',kind:'구분',title:'제목',items:'내역',amount:'금액',note:'메모'};
function recordsToCSV(recs){
  const rows=[REC_COLS.map(c=>COL_KO[c])];
  recs.forEach(r=>rows.push(REC_COLS.map(c=>c==='items'?(r.items||[]).join(' | '):r[c])));
  return rows.map(r=>r.map(csvEsc).join(',')).join('\n');
}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=c;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>x!==''));
}
function normDate(s){const m=String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):null;}
function toNum(s){const t=String(s==null?'':s).replace(/[^\d.-]/g,'');return t===''?null:Number(t);}
function csvToRecords(text){
  const rows=parseCSV(text.replace(/^﻿/,''));if(rows.length<2)return [];
  const head=rows[0].map(h=>h.trim());const idx={};
  REC_COLS.forEach(c=>{let i=head.indexOf(COL_KO[c]);if(i<0)i=head.indexOf(c);idx[c]=i;});
  const out=[];
  rows.slice(1).forEach(r=>{
    const g=c=>idx[c]>=0?(r[idx[c]]||'').trim():'';
    const date=normDate(g('date'));if(!date)return;
    const kind=['repair','insurance','estimate'].includes(g('kind'))?g('kind'):'repair';
    const st=g('shopType')==='general'?'general':'honda';
    out.push({id:g('id')||('i'+out.length+'-'+date),date:date,km:toNum(g('km')),shop:g('shop'),shopType:st,kind:kind,title:g('title'),
      items:g('items')?g('items').split(/\s*\|\s*/).filter(Boolean):[],amount:toNum(g('amount'))||0,note:g('note')});
  });
  return out;
}
/*PURE-END*/

/* ---------- 상태 ---------- */
const S={km:0,records:[],parts:[],insp:[],issues:[],tab:'home',filter:'all',shopf:'all',q:'',editing:null,kmEdit:false,
  db:null,dbState:'loading',loaded:false,err:null,incIns:false,sheet:{files:null,rows:null,msg:'',busy:false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||isNaN(n))?'-':Number(n).toLocaleString('ko-KR');
const won=n=>fmt(n)+'원';
const man=n=>Math.round(n/10000).toLocaleString('ko-KR')+'만';
function today(){const t=new Date();return new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()));}
function todayStr(){return ymd(today());}
function curKm(){if(S.km>0)return S.km;let m=0;S.records.forEach(r=>{if(r.km>m)m=r.km;});return m;}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true;},2600);}
const STAT={ok:['●','정상'],soon:['▲','임박'],over:['■','교체 필요'],none:['–','기록 없음']};
const pill=s=>`<span class="pill ${s}"><i aria-hidden="true">${STAT[s][0]}</i>${STAT[s][1]}</span>`;
const KIND={repair:'정비',insurance:'보험',estimate:'견적'};
function kindPill(k){return `<span class="pill ${k==='insurance'||k==='estimate'?'ins':'ok'}"><i aria-hidden="true">${k==='repair'?'●':k==='insurance'?'◆':'○'}</i>${KIND[k]||k}</span>`;}
function shopPill(t){return `<span class="pill ${t==='honda'?'honda':'general'}"><i aria-hidden="true">●</i>${t==='honda'?'혼다 공식':'일반'}</span>`;}
const byDateDesc=(a,b)=>(b.date||'').localeCompare(a.date||'');
function errMsg(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return 'Google Drive 연결이 만료됐어요. claude.ai 설정의 커넥터에서 다시 연결하세요.';
  if(c==='server_not_connected'||c==='server_not_found')return 'Google Drive 커넥터가 연결돼 있지 않아요. claude.ai 설정의 커넥터에서 추가하세요.';
  if(c==='approval_required'||c==='not_in_manifest'||c==='consent_required')return '이 페이지의 Google Drive 사용을 허용해야 해요. 버튼을 다시 눌러 허용하세요.';
  if(c==='blocked_by_policy')return '조직 정책이 이 작업을 막고 있어요.';
  if(c==='server_unavailable'||c==='upstream_error')return 'Google Drive가 응답하지 않았어요. 잠시 뒤 다시 시도하세요.';
  return '작업에 실패했어요'+(e&&e.message?': '+e.message:'');
}

/* ---------- 헤더 ---------- */
function renderHead(){
  if(S.kmEdit&&$('#kmInput'))return;
  const km=curKm();
  const s=String(km).padStart(6,'0');let started=false;
  const cells=s.split('').map((d,i)=>{if(d!=='0')started=true;const z=!started&&i<s.length-1;return (i===3?'<span class="sep"></span>':'')+`<span class="d${z?' z':''}">${d}</span>`;}).join('');
  $('#head').innerHTML=S.kmEdit
    ?`<span class="odo-label">현재 주행거리</span><div class="km-edit"><input id="kmInput" type="number" inputmode="numeric" min="0" value="${km||''}" aria-label="현재 주행거리(km)"><button class="btn primary" data-act="saveKm">저장</button><button class="btn" data-act="cancelKm">취소</button></div>`
    :`<span class="odo-label">현재 주행거리</span><div class="odo" role="img" aria-label="현재 주행거리 ${fmt(km)}km">${cells}<span class="u">km</span></div><button class="btn ghost" data-act="editKm">주행거리 수정</button>`;
  if(S.kmEdit){const i=$('#kmInput');if(i){i.focus();i.select();}}
}
const TABS=[['home','요약'],['parts','교체 주기'],['log','정비 이력'],['stats','통계'],['sheet','시트']];
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${S.tab===t[0]}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('');
}

/* ---------- 요약 ---------- */
function latestInsp(){return S.insp.slice().sort(byDateDesc)[0]||null;}
function homeHTML(){
  const km=curKm(),t=today();
  const attn=S.parts.map(p=>({p:p,c:calcPart(p,km,t)})).filter(x=>x.c.status==='over'||x.c.status==='soon').sort((a,b)=>b.c.ratio-a.c.ratio);
  const li=latestInsp();
  let insp='<p class="hint">검사 기록이 없어요.</p>';
  if(li&&li.nextDate){
    const dd=daysBetween(t,pd(li.nextDate));
    const ws=ymd(new Date(pd(li.nextDate).getTime()-90*DAY)),we=ymd(new Date(pd(li.nextDate).getTime()+31*DAY));
    const inWin=todayStr()>=ws&&todayStr()<=we;
    const label=dd>0?'D-'+dd:dd===0?'D-Day':'D+'+(-dd);
    insp=`<div class="big num">${label}</div><div class="meta" style="color:var(--ink2)">다음 종합검사일 <span class="num">${esc(li.nextDate)}</span></div>
      <div class="meta" style="color:var(--ink2);margin-top:4px">검사 가능 기간 <span class="num">${ws} ~ ${we}</span> ${inWin?pill('soon').replace('임박','검사 기간'):''}</div>

/* ---------- 통계 ---------- */
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function statsData(){
  const recs=S.records.filter(r=>r.kind==='repair'||(S.incIns&&r.kind==='insurance'));
  const years={};recs.forEach(r=>{const y=(r.date||'').slice(0,4);if(!y)return;(years[y]=years[y]||{sum:0,n:0});years[y].sum+=r.amount||0;years[y].n++;});
  const ys=Object.keys(years).map(Number);
  const list=[];
  if(ys.length){for(let y=Math.min.apply(null,ys);y<=Math.max.apply(null,ys);y++)list.push({y:String(y),sum:(years[y]||{sum:0}).sum,n:(years[y]||{n:0}).n});}
  const shops={};recs.forEach(r=>{const k=r.shop||'기타';(shops[k]=shops[k]||{sum:0,n:0,type:r.shopType});shops[k].sum+=r.amount||0;shops[k].n++;});
  const shopList=Object.keys(shops).map(k=>({name:k,sum:shops[k].sum,n:shops[k].n,type:shops[k].type})).sort((a,b)=>b.sum-a.sum);
  const pts=[];const seen={};
  S.records.concat(S.insp).forEach(r=>{if(!r.date||!r.km)return;const k=r.date+'|'+r.km;if(seen[k])return;seen[k]=1;pts.push({date:r.date,km:r.km});});
  pts.sort((a,b)=>a.date.localeCompare(b.date));
  return {list:list,shopList:shopList,pts:pts,total:recs.reduce((a,r)=>a+(r.amount||0),0)};
}
function yearChart(d){
  const W=640,H=250,L=48,R=10,T=22,B=28;
  if(!d.list.length)return {html:'<p class="hint">표시할 지출이 없어요.</p>',pts:[],W:W};
  const maxV=Math.max.apply(null,d.list.map(x=>x.sum))||1;
  const step=niceStep(maxV/4),max=step*Math.ceil(maxV/step);
  const iw=W-L-R,ih=H-T-B,band=iw/d.list.length,bw=Math.min(54,band*0.55);
  const y=v=>T+ih-(v/max)*ih;let g='',bars='',pts=[];
  for(let v=0;v<=max+1;v+=step){g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v===0?'0':man(v)}</text>`;}
  d.list.forEach((x,i)=>{const cx=L+band*i+band/2,h=(x.sum/max)*ih,top=T+ih-h;
    if(x.sum>0){const r=Math.min(4,h/2);bars+=`<path class="bar" d="M${cx-bw/2},${T+ih} V${top+r} Q${cx-bw/2},${top} ${cx-bw/2+r},${top} H${cx+bw/2-r} Q${cx+bw/2},${top} ${cx+bw/2},${top+r} V${T+ih} Z"/><text class="vlab" x="${cx}" y="${top-6}" text-anchor="middle">${man(x.sum)}</text>`;}
    bars+=`<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle">${x.y}</text>`;
    pts.push({x:cx,y:top,html:`<b>${x.y}년</b><br>${won(x.sum)} · ${x.n}건`});});
  return {html:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="연도별 정비비">${g}<line class="ax" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>${bars}</svg><div class="tip" hidden></div>`,pts:pts,W:W};
}
function kmChart(d){
  const W=640,H=250,L=56,R=14,T=16,B=28;
  if(d.pts.length<2)return {html:'<p class="hint">주행거리 기록이 2개 이상 필요해요.</p>',pts:[],W:W};
  const t0=pd(d.pts[0].date).getTime(),t1=pd(d.pts[d.pts.length-1].date).getTime();
  const kmin=Math.min.apply(null,d.pts.map(p=>p.km)),kmax=Math.max.apply(null,d.pts.map(p=>p.km));
  const lo=Math.floor(kmin/10000)*10000,hi=Math.ceil(kmax/10000)*10000||lo+10000;
  const iw=W-L-R,ih=H-T-B;
  const X=t=>L+(t-t0)/Math.max(1,t1-t0)*iw,Y=k=>T+ih-(k-lo)/Math.max(1,hi-lo)*ih;
  let g='';const ts=Math.max(1,Math.round((hi-lo)/10000/4))*10000;
  for(let k=lo;k<=hi;k+=ts)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(k)}" y2="${Y(k)}"/><text class="tick" x="${L-6}" y="${Y(k)+4}" text-anchor="end">${fmt(k)}</text>`;
  const y0=new Date(t0).getUTCFullYear(),y1=new Date(t1).getUTCFullYear();let xt='';
  for(let y=y0+1;y<=y1;y++){const tt=Date.UTC(y,0,1);xt+=`<text class="tick" x="${X(tt)}" y="${H-8}" text-anchor="middle">${y}</text><line class="ax" x1="${X(tt)}" x2="${X(tt)}" y1="${T+ih}" y2="${T+ih+4}"/>`;}
  const pts=d.pts.map(p=>({x:X(pd(p.date).getTime()),y:Y(p.km),html:`<b>${p.date}</b><br>${fmt(p.km)}km`}));
  const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  return {html:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주행거리 추이">${g}<line class="ax" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>${xt}<path class="ln" d="${path}"/>${pts.map(p=>`<circle class="pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"/>`).join('')}<circle class="hl" r="7" cx="-20" cy="-20"/></svg><div class="tip" hidden></div>`,pts:pts,W:W};
}
let CH=[];
function statsHTML(){

   <section><h2 class="sec">주행거리 추이 (km)</h2><div class="cbox" id="c2">${kc.html}</div>${perYear?`<p class="hint" style="margin-top:8px">${perYear}</p>`:''}</section>
  </div>`;

function bindTip(box,c){
  if(!box||!c.pts.length)return;
  const svg=box.querySelector('svg'),tip=box.querySelector('.tip'),hl=svg.querySelector('.hl');
  svg.addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(),sc=r.width/c.W,x=(e.clientX-r.left)/sc;let b=null,bd=1e9;
    c.pts.forEach(p=>{const dd=Math.abs(p.x-x);if(dd<bd){bd=dd;b=p;}});
    if(!b)return;tip.hidden=false;tip.innerHTML=b.html;tip.style.left=(b.x*sc)+'px';tip.style.top=(b.y*sc)+'px';
    if(hl){hl.setAttribute('cx',b.x);hl.setAttribute('cy',b.y);}
  });
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;if(hl){hl.setAttribute('cx',-20);hl.setAttribute('cy',-20);}});
}

    const mcp=await getMcp();if(!mcp){sh.exportMsg='이 보기에서는 Google Drive를 쓸 수 없어요.';return;}
    const title='시빅 정비이력 '+todayStr();
    const res=await mcp.callTool('Google Drive','create_file',{title:title,textContent:recordsToCSV(S.records.slice().sort(byDateDesc)),contentMimeType:'text/csv'},{cache:false});
    const p=res.payload&&typeof res.payload==='object'?res.payload:{};
    const url=p.webViewLink||p.url||p.link||p.alternateLink||(p.id?'https://docs.google.com/spreadsheets/d/'+p.id:'');
    sh.exportMsg=url?`만들었어요: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>`:`만들었어요: ${esc(title)} (Drive에서 확인하세요)`;
  }catch(e){sh.exportMsg=esc(errMsg(e));}
  finally{sh.busy=false;render();}
}
function extractFiles(p){
  if(!p)return [];const arr=Array.isArray(p)?p:(p.files||p.results||p.items||[]);
  return arr.map(f=>({id:f.id||f.fileId,title:f.title||f.name||'(제목 없음)',modified:f.modifiedTime||f.modified||''})).filter(f=>f.id);
}
function b64ToText(b){const bin=atob(b.replace(/\s/g,''));const u=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(u);}
function extractText(res){
  const p=res.payload;let cand=null;
  if(typeof p==='string')cand=p;
  else if(p&&typeof p==='object'){for(const k of ['base64Content','content','data','text','fileContent']){if(typeof p[k]==='string'){cand=p[k];break;}}}
  if(cand==null&&res.content){const t=res.content.find(c=>c.type==='text');if(t)cand=t.text;}
  if(cand==null)return null;
  if(/^[A-Za-z0-9+/=\s]+$/.test(cand)&&cand.replace(/\s/g,'').length%4===0&&!/,/.test(cand)){try{return b64ToText(cand);}catch(e){}}
  return cand;
}
async function sheetList(){
  const sh=S.sheet;sh.busy=true;sh.importMsg='찾는 중…';sh.rows=null;render();
  try{
    const mcp=await getMcp();if(!mcp){sh.importMsg='이 보기에서는 Google Drive를 쓸 수 없어요.';return;}
    const res=await mcp.callTool('Google Drive','search_files',{query:"mimeType = 'application/vnd.google-apps.spreadsheet' and title contains '시빅 정비이력'",pageSize:10,excludeContentSnippets:true},{cache:false});
    sh.files=extractFiles(res.payload);sh.importMsg='';
  }catch(e){sh.importMsg=esc(errMsg(e));}
  finally{sh.busy=false;render();}
}
async function sheetPick(id){
  const sh=S.sheet;sh.busy=true;sh.importMsg='읽는 중…';render();
  try{
    const mcp=await getMcp();if(!mcp){sh.importMsg='이 보기에서는 Google Drive를 쓸 수 없어요.';return;}
    const res=await mcp.callTool('Google Drive','download_file_content',{fileId:id,exportMimeType:'text/csv'},{cache:false});
    const text=extractText(res);
    if(text==null){sh.importMsg='시트 내용을 읽지 못했어요.';return;}
    const rows=csvToRecords(text);
    sh.rows=rows;sh.importMsg=rows.length?'':'정비 이력 형식의 행을 찾지 못했어요. 열 이름(날짜, 정비소, 제목 등)을 확인하세요.';
  }catch(e){sh.importMsg=esc(errMsg(e));}
  finally{sh.busy=false;render();}
}
async function sheetApply(){
  const sh=S.sheet;if(!S.db||!sh.rows)return;sh.busy=true;sh.importMsg='적용하는 중…';render();
  let n=0;
  try{
    for(const r of sh.rows){const id=String(r.id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,100);const body=Object.assign({},r);delete body.id;await S.db.collection('records').doc(id).set(body);n++;}
    sh.importMsg=`${n}건을 병합했어요.`;sh.rows=null;
  }catch(e){sh.importMsg=`${n}건 적용 후 실패했어요. ${esc((e&&e.code)||'')}`;}
  finally{sh.busy=false;render();}
}

/* ---------- 폼 ---------- */
const FORMS={
  record:{col:'records',title:'정비 기록',fields:[
    {k:'date',l:'날짜',t:'date',req:1},{k:'km',l:'주행거리(km)',t:'num'},{k:'shop',l:'정비소',t:'text',req:1},
    {k:'shopType',l:'정비소 유형',t:'sel',o:[['honda','혼다 공식'],['general','일반']]},
    {k:'kind',l:'구분',t:'sel',o:[['repair','정비 (자비)'],['insurance','보험 수리'],['estimate','견적']]},
    {k:'amount',l:'금액(원, VAT 포함)',t:'num'},{k:'title',l:'제목',t:'text',req:1,w:1},
    {k:'items',l:'내역 (줄바꿈으로 구분)',t:'lines',w:1},{k:'note',l:'메모',t:'area',w:1}]},
  part:{col:'parts',title:'교체 항목',fields:[
    {k:'name',l:'항목명',t:'text',req:1,w:1},{k:'intervalKm',l:'교체 주기(km)',t:'num'},{k:'intervalMonths',l:'교체 주기(개월)',t:'num'},
    {k:'lastDate',l:'마지막 교체일',t:'date'},{k:'lastKm',l:'마지막 교체 주행거리(km)',t:'num'},{k:'note',l:'메모',t:'area',w:1}]},
  insp:{col:'inspections',title:'종합검사',fields:[
    {k:'date',l:'검사일',t:'date',req:1},{k:'km',l:'주행거리(km)',t:'num'},{k:'result',l:'결과',t:'text'},
    {k:'nextDate',l:'다음 검사일',t:'date'},{k:'note',l:'메모',t:'area',w:1}]},
  issue:{col:'issues',title:'이슈',fields:[
    {k:'text',l:'내용',t:'area',req:1,w:1},{k:'since',l:'발견일',t:'date'}]}
};
const LIST_OF={record:'records',part:'parts',insp:'insp',issue:'issues'};
function formDefaults(type){
  if(type==='record')return {date:todayStr(),km:curKm()||null,shopType:'honda',kind:'repair',items:[],amount:0};
  if(type==='insp')return {date:todayStr(),km:curKm()||null,result:'적합'};
  if(type==='issue')return {since:todayStr(),status:'open'};
  return {};
}
function formHTML(){
  const E=S.editing,F=FORMS[E.type],d=E.data;
  const f=F.fields.map(x=>{
    let v=d[x.k];let inp;
    if(x.t==='sel')inp=`<select id="f_${x.k}">${x.o.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    else if(x.t==='area')inp=`<textarea id="f_${x.k}">${esc(v||'')}</textarea>`;
    else if(x.t==='lines')inp=`<textarea id="f_${x.k}">${esc((v||[]).join('\n'))}</textarea>`;
    else if(x.t==='num')inp=`<input id="f_${x.k}" type="number" inputmode="numeric" value="${v==null?'':esc(v)}">`;
    else inp=`<input id="f_${x.k}" type="${x.t==='date'?'date':'text'}" value="${esc(v||'')}">`;
    return `<label class="f ${x.w?'wide':''}">${x.l}${x.req?' *':''}${inp}</label>`;}).join('');
  return `<section class="panel"><h3>${F.title} ${E.id?'수정':'추가'}</h3><div class="formgrid" style="margin-top:12px">${f}</div>
    <div class="actions" style="margin-top:16px"><button class="btn primary" data-act="save">저장</button><button class="btn" data-act="cancel">취소</button>${E.id?'<button class="btn danger" data-act="del" style="margin-left:auto">삭제</button>':''}</div>
    <div class="out" id="formMsg"></div></section>`;
}
async function saveForm(){
  const E=S.editing,F=FORMS[E.type],body=Object.assign({},E.data);
  for(const x of F.fields){
    const el=$('#f_'+x.k);if(!el)continue;let v=el.value;
    if(x.t==='num')v=v.trim()===''?null:Number(v);
    else if(x.t==='lines')v=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else v=v.trim();
    if(x.req&&(v===''||v==null||(Array.isArray(v)&&!v.length))){$('#formMsg').textContent=`${x.l} 항목이 필요해요.`;return;}
    body[x.k]=v;
  }
  delete body.id;
  if(!S.db){$('#formMsg').textContent='저장소를 쓸 수 없어요.';return;}
  try{
    if(E.id)await S.db.collection(F.col).doc(E.id).set(body);else await S.db.collection(F.col).add(body);
    if(E.type==='record'&&body.kind!=='estimate'&&body.km>S.km){await S.db.doc('settings/main').set({currentKm:body.km});}
    S.editing=null;toast('저장됨');renderAll();
  }catch(e){$('#formMsg').textContent='저장하지 못했어요'+(e&&e.code?` (${e.code})`:'');}
}

/* ---------- 렌더 ---------- */
function bodyHTML(){
  if(S.dbState==='none')return `<div class="empty"><b>저장소를 열 수 없어요</b>이 보기에서는 데이터를 읽고 쓸 수 없어요. claude.ai에서 로그인한 상태로 페이지를 여세요.</div>`;
  if(!S.loaded)return `<div class="empty"><b>불러오는 중</b>정비 기록을 가져오고 있어요.</div>`;
  if(!S.records.length&&!S.parts.length&&!S.editing&&S.tab!=='sheet')return `<div class="empty"><b>아직 기록이 없어요</b>정비 이력 탭에서 첫 기록을 추가하거나 시트 탭에서 불러오세요.<div class="actions" style="margin-top:12px"><button class="btn primary" data-act="new" data-type="record">정비 추가</button></div></div>`;
  return ({home:homeHTML,parts:partsHTML,log:logHTML,stats:statsHTML,sheet:sheetHTML})[S.tab]();
}
function render(){
  renderHead();renderTabs();
  if(S.editing){$('#view').innerHTML=formHTML();return;}
  $('#view').innerHTML=S.err&&S.dbState==='ready'?`<p class="notice">데이터를 읽는 중 문제가 생겼어요 (${esc(S.err)}). 새로고침하세요.</p>`+bodyHTML():bodyHTML();
  if(S.tab==='stats'&&S.loaded)CH.forEach(x=>bindTip($('#'+x.id),x.c));
}
const renderAll=render;

/* ---------- 이벤트 ---------- */
const H={
  tab(b){S.tab=b.dataset.v;S.editing=null;try{history.replaceState(null,'','#'+S.tab);}catch(e){}render();},
  filter(b){S.filter=b.dataset.v;render();},
  shopf(b){S.shopf=b.dataset.v;render();},
  editKm(){S.kmEdit=true;renderHead();},
  cancelKm(){S.kmEdit=false;renderHead();},
  async saveKm(){const v=Number($('#kmInput').value);if(!(v>=0)||!S.db)return;try{await S.db.doc('settings/main').set({currentKm:v});S.kmEdit=false;toast('주행거리 저장됨');renderHead();}catch(e){toast('저장하지 못했어요');}},
  new(b){S.editing={type:b.dataset.type,id:null,data:formDefaults(b.dataset.type)};render();window.scrollTo(0,0);},
  edit(b){const list=S[LIST_OF[b.dataset.type]],d=list.find(x=>x.id===b.dataset.id);if(!d)return;S.editing={type:b.dataset.type,id:d.id,data:Object.assign({},d)};render();window.scrollTo(0,0);},
  save(){saveForm();},
  cancel(){S.editing=null;render();},
  async del(b){
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='한 번 더 누르면 삭제';return;}
    const E=S.editing;try{await S.db.collection(FORMS[E.type].col).doc(E.id).delete();S.editing=null;toast('삭제됨');render();}catch(e){$('#formMsg').textContent='삭제하지 못했어요';}
  },
  async replaced(b){
    const km=curKm();if(!km){toast('현재 주행거리를 먼저 입력하세요');return;}
    try{await S.db.collection('parts').doc(b.dataset.id).update({lastDate:todayStr(),lastKm:km});toast('교체 기록됨');}catch(e){toast('저장하지 못했어요');}
  },
  async issueDone(b){try{await S.db.collection('issues').doc(b.dataset.id).update({status:'done',doneDate:todayStr()});toast('이슈 완료');}catch(e){toast('저장하지 못했어요');}},
  sheetExport(){sheetExport();},sheetList(){sheetList();},sheetPick(b){sheetPick(b.dataset.id);},sheetApply(){sheetApply();},
  sheetClear(){S.sheet.rows=null;S.sheet.importMsg='';render();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&H[b.dataset.act])H[b.dataset.act](b,e);});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const l=$('#loglist');if(l)l.innerHTML=logListHTML();}
});
document.addEventListener('change',e=>{if(e.target.id==='incIns'){S.incIns=e.target.checked;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='kmInput')H.saveKm();});

/* ---------- 데이터 연결 ---------- */
(async function init(){
  const h=(location.hash||'').replace('#','');if(TABS.some(t=>t[0]===h))S.tab=h;
  render();
  const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
  if(!db){S.dbState='none';render();return;}
  S.db=db;S.dbState='ready';
  const first={};
  const sub=(col,key)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>Object.assign({id:d.id},d.data()));first[key]=1;if(first.records&&first.parts&&first.insp&&first.issues)S.loaded=true;if(!S.editing)render();else renderHead();},e=>{S.err=e&&e.code||'error';S.loaded=true;render();});
  sub('records','records');sub('parts','parts');sub('inspections','insp');sub('issues','issues');
  db.doc('settings/main').onSnapshot(d=>{const v=d.data();S.km=v&&v.currentKm?v.currentKm:0;if(!S.editing)render();else renderHead();},()=>{});
})();
</script>
